name: Build MCRP Launcher APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java (necessário pro Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Compilar a APK (debug, já vem assinada)
        run: ./gradlew assembleDebug

      - name: Publicar a APK como artifact para download
        uses: actions/upload-artifact@v4
        with:
          name: mcrp-launcher-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
